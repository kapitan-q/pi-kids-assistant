# Публикация gateway за общим Traefik (сеть webnet) с basic-auth на весь хост.
# Подключается через COMPOSE_FILE в .env:
#   COMPOSE_FILE=docker-compose.yml:docker-compose.traefik.yml
# Нужны в .env: KS_HOST, BASIC_AUTH_USERS (bcrypt, в одинарных кавычках).
# Голосовая колонка — за basic-auth; интерфейс Audiobookshelf — за своим логином.
services:
  gateway:
    networks:
      - default
      - webnet
    labels:
      - traefik.enable=true
      - traefik.docker.network=webnet
      - traefik.http.routers.kids-speaker.rule=Host(`${KS_HOST:?укажи KS_HOST в .env}`)
      - traefik.http.routers.kids-speaker.entrypoints=websecure
      - traefik.http.routers.kids-speaker.tls.certresolver=${TRAEFIK_CERTRESOLVER:-le}
      - traefik.http.routers.kids-speaker.middlewares=kids-speaker-auth,kids-speaker-body
      - traefik.http.middlewares.kids-speaker-auth.basicauth.users=${BASIC_AUTH_USERS:?укажи BASIC_AUTH_USERS в .env}
      - traefik.http.middlewares.kids-speaker-auth.basicauth.removeheader=true
      - traefik.http.middlewares.kids-speaker-body.buffering.maxRequestBodyBytes=5000000
      - traefik.http.services.kids-speaker.loadbalancer.server.port=8080

  # Веб-интерфейс Audiobookshelf: /audiobookshelf (фиксированный подпуть ABS), /admin и /books — редирект туда.
  # Без basic-auth: у ABS свой вход, а его приложения для телефона basic-auth не умеют.
  audiobookshelf:
    networks:
      - default
      - webnet
    labels:
      - traefik.enable=true
      - traefik.docker.network=webnet
      - traefik.http.routers.kids-speaker-abs.rule=Host(`${KS_HOST}`) && PathPrefix(`/audiobookshelf`)
      - traefik.http.routers.kids-speaker-abs.entrypoints=websecure
      - traefik.http.routers.kids-speaker-abs.tls.certresolver=${TRAEFIK_CERTRESOLVER:-le}
      - traefik.http.routers.kids-speaker-abs.service=kids-speaker-abs
      - traefik.http.routers.kids-speaker-admin.rule=Host(`${KS_HOST}`) && (Path(`/admin`) || PathPrefix(`/admin/`) || Path(`/books`) || PathPrefix(`/books/`))
      - traefik.http.routers.kids-speaker-admin.entrypoints=websecure
      - traefik.http.routers.kids-speaker-admin.tls.certresolver=${TRAEFIK_CERTRESOLVER:-le}
      - traefik.http.routers.kids-speaker-admin.middlewares=kids-speaker-admin-redirect
      - traefik.http.routers.kids-speaker-admin.service=kids-speaker-abs
      - traefik.http.middlewares.kids-speaker-admin-redirect.redirectregex.regex=^https://([^/]+)/(admin|books).*
      - traefik.http.middlewares.kids-speaker-admin-redirect.redirectregex.replacement=https://$${1}/audiobookshelf/
      - traefik.http.services.kids-speaker-abs.loadbalancer.server.port=80

networks:
  webnet:
    external: true
