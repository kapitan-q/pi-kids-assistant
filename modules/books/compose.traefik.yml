# Публикация модуля books за Traefik (вместе с docker-compose.traefik.yml).
services:
  # Веб-интерфейс Audiobookshelf: /audiobookshelf (фиксированный подпуть ABS), /books — редирект туда.
  # Без basic-auth: у ABS свой вход, а его приложения для телефона basic-auth не умеют.
  audiobookshelf:
    networks:
      - default
      - webnet
    labels:
      - traefik.enable=true
      - traefik.docker.network=webnet
      - traefik.http.routers.kids-speaker-abs.rule=Host(`${KS_HOST}`) && PathPrefix(`/audiobookshelf`)
      - traefik.http.routers.kids-speaker-abs.entrypoints=websecure
      - traefik.http.routers.kids-speaker-abs.tls.certresolver=${TRAEFIK_CERTRESOLVER:-le}
      - traefik.http.routers.kids-speaker-abs.service=kids-speaker-abs
      - traefik.http.routers.kids-speaker-books.rule=Host(`${KS_HOST}`) && (Path(`/books`) || PathPrefix(`/books/`) || Path(`/admin`) || PathPrefix(`/admin/`))
      - traefik.http.routers.kids-speaker-books.entrypoints=websecure
      - traefik.http.routers.kids-speaker-books.tls.certresolver=${TRAEFIK_CERTRESOLVER:-le}
      - traefik.http.routers.kids-speaker-books.middlewares=kids-speaker-books-redirect
      - traefik.http.routers.kids-speaker-books.service=kids-speaker-abs
      - traefik.http.middlewares.kids-speaker-books-redirect.redirectregex.regex=^https://([^/]+)/(admin|books).*
      - traefik.http.middlewares.kids-speaker-books-redirect.redirectregex.replacement=https://$${1}/audiobookshelf/
      - traefik.http.services.kids-speaker-abs.loadbalancer.server.port=80

networks:
  webnet:
    external: true
