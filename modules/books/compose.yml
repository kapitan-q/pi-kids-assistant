# Модуль books: каталог аудиокниг и сказок поверх Audiobookshelf.
# Подключение — в .env: COMPOSE_FILE=docker-compose.yml:modules/books/compose.yml:...
# Пути — от корня проекта (каталог первого compose-файла).
x-books-logging: &books-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  books:
    restart: unless-stopped
    logging: *books-logging
    build: ./modules/books
    # MCP (/mcp, /svc/mcp) доступен только внутри compose-сети; наружу — только /stream (через Traefik).
    environment:
      TZ: ${TZ:-Europe/Belgrade}
      ABS_URL: http://audiobookshelf
      ABS_API_KEY: ${ABS_API_KEY:-}            # ключ пользователя speaker (modules/books/scripts/abs_setup.py)
      ABS_LIBRARY_ID: ${ABS_LIBRARY_ID:-}
      CATALOG_REFRESH_SEC: ${CATALOG_REFRESH_SEC:-300}
    volumes:
      - ./library:/library:ro        # та же папка, что /audiobooks у Audiobookshelf
      - ./data/merged:/data/merged   # склеенные многофайловые книги
      - ./data/books:/data           # сколько раз слушали (для случайной сказки)
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      audiobookshelf: {condition: service_healthy}

  audiobookshelf:
    restart: unless-stopped
    logging: *books-logging
    image: ghcr.io/advplyr/audiobookshelf:2.37.2
    # Веб-интерфейс: $PUBLIC_BASE_URL/audiobookshelf/ (/books — редирект туда), вход по логину ABS.
    environment:
      TZ: ${TZ:-Europe/Belgrade}
    volumes:
      - ./library:/audiobooks        # сюда же попадают книги, загруженные через интерфейс
      - abs-config:/config           # база Audiobookshelf (sqlite), пользователи, прогресс
      - abs-metadata:/metadata       # обложки, кэш
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthcheck >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  abs-config:
  abs-metadata:
