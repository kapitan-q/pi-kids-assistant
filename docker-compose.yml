# Домашняя колонка-сказочница.
# Наружу не публикуется ни один порт. Доступ к gateway — через оверлей:
#   docker-compose.traefik.yml — за Traefik с basic-auth (сервер titan)
#   docker-compose.local.yml   — порт 8080 в локальной сети (вариант «дома»)
# Нужный набор задаётся в .env через COMPOSE_FILE.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-common: &common
  restart: unless-stopped
  logging: *logging

services:
  gateway:
    <<: *common
    build: ./gateway
    environment:
      TZ: ${TZ:-Europe/Belgrade}
      STT_URL: http://stt:8000
      TTS_URL: http://tts:8000
      AGENT_URL: http://agent:8000
      TALES_URL: http://tales:8000
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?укажи PUBLIC_BASE_URL в .env}
      GATEWAY_TOKEN: ${GATEWAY_TOKEN:-}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      QUICK_COMMANDS: ${QUICK_COMMANDS:-1}
      AGENT_HTTP_TIMEOUT: ${AGENT_HTTP_TIMEOUT:-40}
      MAX_AUDIO_BYTES: ${MAX_AUDIO_BYTES:-5000000}
    volumes:
      - ./library:/library:ro
      - ./config:/config:ro          # policies.yaml — правится на лету
      - ./data/state:/data/state     # временные команды, бюджеты ночных сказок
      - ./data/merged:/merged:ro     # склеенные книги (готовит tales)
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/livez', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      # Traefik не маршрутизирует контейнер, пока он «starting» — проверяем часто на старте
      start_period: 30s
      start_interval: 2s
    depends_on:
      stt: {condition: service_healthy}
      tts: {condition: service_healthy}
      agent: {condition: service_healthy}
      tales: {condition: service_healthy}

  agent:
    <<: *common
    build: ./agent
    environment:
      TZ: ${TZ:-Europe/Belgrade}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?укажи ANTHROPIC_API_KEY в .env}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-haiku-5-5}
      TALES_MCP_URL: http://tales:8000/mcp
      SESSION_IDLE_SEC: ${SESSION_IDLE_SEC:-600}
      AGENT_TURN_TIMEOUT: ${AGENT_TURN_TIMEOUT:-30}
      AGENT_EFFORT: ${AGENT_EFFORT:-}
      ALLOWED_DEVICES: ${ALLOWED_DEVICES:-}
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-30}
    volumes:
      - ./agent/system_prompt.md:/app/system_prompt.md:ro
      - ./data/logs:/data/logs
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      tales: {condition: service_healthy}

  stt:
    <<: *common
    build: ./stt
    environment:
      TZ: ${TZ:-Europe/Belgrade}
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      WHISPER_COMPUTE: int8
      WHISPER_LANG: ru
      WHISPER_THREADS: ${WHISPER_THREADS:-4}
    volumes:
      - whisper-models:/models
    cpus: ${STT_CPUS:-4}
    healthcheck:
      test: ["CMD", "python", "-c", "import json, urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3))['ok']"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 600s   # первый старт качает модель Whisper

  tts:
    <<: *common
    build: ./tts
    environment:
      TZ: ${TZ:-Europe/Belgrade}
      PIPER_VOICE: ${PIPER_VOICE:-ru_RU-irina-medium}
      PIPER_LENGTH_SCALE: ${PIPER_LENGTH_SCALE:-1.1}
    volumes:
      - piper-voices:/voices
    healthcheck:
      test: ["CMD", "python", "-c", "import json, urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3))['ok']"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 300s   # первый старт качает голос Piper

  tales:
    <<: *common
    build: ./tales
    # MCP (/mcp) доступен только внутри compose-сети — наружу не публикуется.
    environment:
      TZ: ${TZ:-Europe/Belgrade}
      ABS_URL: http://audiobookshelf
      ABS_API_KEY: ${ABS_API_KEY:-}            # ключ пользователя speaker (scripts/abs_setup.py)
      ABS_LIBRARY_ID: ${ABS_LIBRARY_ID:-}
      CATALOG_REFRESH_SEC: ${CATALOG_REFRESH_SEC:-300}
    volumes:
      - ./library:/library:ro        # та же папка, что /audiobooks у Audiobookshelf
      - ./data/merged:/data/merged   # склеенные многофайловые книги
      - ./data/tales:/data           # сколько раз слушали (для случайной сказки)
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      audiobookshelf: {condition: service_healthy}

  audiobookshelf:
    <<: *common
    image: ghcr.io/advplyr/audiobookshelf:2.37.2
    # Каталог сказок. Веб-интерфейс: $PUBLIC_BASE_URL/audiobookshelf/ (/admin — редирект туда),
    # вход по логину Audiobookshelf. Порт наружу не публикуется.
    environment:
      TZ: ${TZ:-Europe/Belgrade}
    volumes:
      - ./library:/audiobooks        # сюда же попадают книги, загруженные через интерфейс
      - abs-config:/config           # база Audiobookshelf (sqlite), пользователи, прогресс
      - abs-metadata:/metadata       # обложки, кэш
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthcheck >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  abs-config:
  abs-metadata:
  whisper-models:
  piper-voices:
