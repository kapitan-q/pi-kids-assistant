# Домашняя голосовая колонка — ядро: gateway, agent, stt, tts.
# Модули подключаются своими compose-файлами (modules/<имя>/compose.yml) через COMPOSE_FILE в .env.
# Наружу не публикуется ни один порт. Доступ к gateway — через оверлей:
#   docker-compose.traefik.yml — за Traefik с basic-auth (сервер titan)
#   docker-compose.local.yml   — порт 8080 в локальной сети (вариант «дома»)

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-common: &common
  restart: unless-stopped
  logging: *logging

services:
  gateway:
    <<: *common
    build: ./core/gateway
    environment:
      TZ: ${TZ:-Europe/Belgrade}
      STT_URL: http://stt:8000
      TTS_URL: http://tts:8000
      AGENT_URL: http://agent:8000
      VOICEID_URL: http://voiceid:8000
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?укажи PUBLIC_BASE_URL в .env}
      GATEWAY_TOKEN: ${GATEWAY_TOKEN:-}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      QUICK_COMMANDS: ${QUICK_COMMANDS:-1}
      AGENT_HTTP_TIMEOUT: ${AGENT_HTTP_TIMEOUT:-40}
      MAX_AUDIO_BYTES: ${MAX_AUDIO_BYTES:-5000000}
      ADMIN_USER: ${ADMIN_USER:-parent}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}   # /admin: bcrypt пароля родителя
    volumes:
      - ./config:/config:ro          # speaker.yaml, modules.yaml, lang/ — правятся на лету
      - ./data/state:/data/state     # прежний state.json (импортируется в speaker.db при первом старте)
      - ./data/core:/data/core       # speaker.db (люди, роли, режимы, журнал) и голоса
      - ./data/app:/data/app:ro      # приложение для телефона (/admin/app.apk), кладёт scripts/publish_apk.sh
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/livez', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      # Traefik не маршрутизирует контейнер, пока он «starting» — проверяем часто на старте
      start_period: 30s
      start_interval: 2s
    depends_on:
      stt: {condition: service_healthy}
      tts: {condition: service_healthy}
      agent: {condition: service_healthy}
      voiceid: {condition: service_healthy}

  agent:
    <<: *common
    build: ./core/agent
    environment:
      TZ: ${TZ:-Europe/Belgrade}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?укажи ANTHROPIC_API_KEY в .env}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-haiku-5-5}
      SESSION_IDLE_SEC: ${SESSION_IDLE_SEC:-600}
      AGENT_TURN_TIMEOUT: ${AGENT_TURN_TIMEOUT:-30}
      AGENT_EFFORT: ${AGENT_EFFORT:-}
      ALLOWED_DEVICES: ${ALLOWED_DEVICES:-}
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-30}
    volumes:
      - ./config:/config:ro          # modules.yaml, lang/
      - ./data/logs:/data/logs
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  stt:
    <<: *common
    build: ./core/stt
    environment:
      TZ: ${TZ:-Europe/Belgrade}
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      WHISPER_COMPUTE: int8
      WHISPER_LANG: ru
      WHISPER_THREADS: ${WHISPER_THREADS:-4}
    volumes:
      - whisper-models:/models
    cpus: ${STT_CPUS:-4}
    healthcheck:
      test: ["CMD", "python", "-c", "import json, urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3))['ok']"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 600s   # первый старт качает модель Whisper

  tts:
    <<: *common
    build: ./core/tts
    environment:
      TZ: ${TZ:-Europe/Belgrade}
      PIPER_VOICE: ${PIPER_VOICE:-ru_RU-irina-medium}
      PIPER_LENGTH_SCALE: ${PIPER_LENGTH_SCALE:-1.1}
    volumes:
      - piper-voices:/voices
    healthcheck:
      test: ["CMD", "python", "-c", "import json, urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3))['ok']"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 300s   # первый старт качает голос Piper

  voiceid:
    <<: *common
    build: ./core/voiceid
    # голосовой отпечаток говорящего (sherpa-onnx); профили и голоса хранит gateway
    environment:
      TZ: ${TZ:-Europe/Belgrade}
      VOICEID_MODEL: ${VOICEID_MODEL:-3dspeaker_speech_eres2net_base_sv_zh-cn_3dspeaker_16k}
    volumes:
      - voiceid-models:/models
    healthcheck:
      test: ["CMD", "python", "-c", "import json, urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3))['ok']"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 300s   # первый старт качает модель

volumes:
  whisper-models:
  piper-voices:
  voiceid-models:
