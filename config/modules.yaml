# Подключённые модули. Ядро (агент и шлюз) знает о модулях только отсюда.
#   url      — внутренний адрес сервиса в compose-сети. От него:
#              {url}/mcp      — инструменты для агента (MCP; instructions сервера попадают в промпт)
#              {url}/svc/mcp  — служебные инструменты для ядра: report_progress, item_info
#              {url}/stream/… — файлы для плеера; Pi получает их как $PUBLIC_BASE_URL/m/<имя>/…
#   title    — как модуль называется для агента и в админке
#   enabled  — false: агент не видит инструментов модуля, шлюз не проверяет его здоровье
# Сервисы модуля — в modules/<имя>/compose.yml, подключаются через COMPOSE_FILE в .env.
modules:
  books:
    title: Сказки и аудиокниги
    url: http://books:8000
    enabled: true
