# Правила колонки: роли, режимы, расписание. Шлюз перечитывает файл на лету — перезапуск не нужен.
# Профили людей — не здесь: они создаются знакомством голосом («давай познакомимся»),
# роль и личные ограничения назначаются в $PUBLIC_BASE_URL/admin (data/core/profiles.json).
# Часовой пояс — TZ из .env (timezone: здесь — только чтобы переопределить).

# Роли: что можно по умолчанию. В профиле в админке можно только сузить (модули, запрещённые теги).
#   modules   — какие модули можно включать (нет поля — любые подключённые)
#   tags_deny — теги, которые нельзя никогда
#   parent    — родитель: команды без кодовой фразы, режимы его не ограничивают
roles:
  parent:
    title: Родитель
    parent: true
  child:
    title: Ребёнок
    modules: [books]
  newcomer:                     # так создаётся каждый новый профиль после знакомства
    title: Новичок
    modules: [books]
  guest:                        # голос не узнан
    title: Гость
    modules: [books]
guest_role: guest
newcomer_role: newcomer
max_profiles: 12

# Узнавание по голосу (сервис voiceid) и знакомство «давай познакомимся».
#   threshold    — косинусная близость к голосу профиля, с которой «узнала» (ниже — гость)
#   consistency  — при знакомстве: насколько образцы должны быть похожи друг на друга
#   min_samples  — сколько образцов нужно, чтобы создать профиль
voice:
  threshold: 0.6
  consistency: 0.5
  min_speech_sec: 0.8
  min_samples: 4
  session_timeout_sec: 120

# Профили до знакомства голосом — переносятся в data/core/profiles.json один раз, при первом запуске.
# Потом правятся в админке; новые голоса можно «объединить» с этими профилями (id остаются для расписания).
import_profiles:
  dad:
    name: Папа
    role: parent
  older:
    name: Старший
    role: child
    age: 9
    aliases: [старш]
  younger:
    name: Младший
    role: child
    age: 7
    aliases: [младш]

# Если правило с who, а голос не опознан — применять его? true = строже.
unknown_speaker_matches: true

# Родительские команды голосом: «<кодовая фраза>, тихий час на сорок минут».
# Голосом можно только ужесточать (тихий час, уроки, ночь): фразу легко подслушать.
# Снять режим — через /control/override (DELETE) или включи voice_can_relax.
# Кодовая фраза не даёт обойти блокировки и не уходит к Claude.
parent:
  passphrase: "капитан немо"
  voice_can_relax: false

modes:
  normal:
    title: Обычный режим
    max_volume: 100

  quiet:
    title: Тихий час
    allow_children: false          # детям не отвечать, сказки не включать
    message: "Я сейчас отдыхаю. Поговорим чуть позже."   # говорится один раз, потом молчит
    default_minutes: 60

  homework:
    title: Режим уроков
    allow_children: false
    message: "Сейчас время уроков. Как закончишь — поговорим!"
    default_minutes: 60

  night:
    title: Ночной режим
    max_volume: 30
    play_budget_min: 60             # всего минут сказок за ночь, потом выключится сама
    tags: ["на ночь"]               # только сказки с этим тегом (пусто/нет поля — любые)
    prompt: "Сейчас ночь. Говори тихо, ласково и очень коротко, предлагай только спокойные сказки."
    budget_message: "Сказки на эту ночь закончились. Закрывай глазки, спокойной ночи."
    tags_message: "Ночью включаю только спокойные сказки на ночь. Давай выберем такую."
    default_minutes: 480

# Расписание: первое подходящее правило побеждает. days: mon..sun, диапазоны «mon-fri».
# Окно через полночь (21:30 → 07:00) работает. Без from/to — весь день.
# who — id профилей (см. /admin) и/или роли: who: [child].
schedule:
  - {days: [mon-fri], from: "15:00", to: "17:00", mode: homework, who: [older]}
  - {from: "21:30", to: "07:00", mode: night}
  - {mode: normal}
