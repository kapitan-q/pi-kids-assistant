# Фразы ядра, которые слышит ребёнок или родитель. Язык выбирается LANG в .env (по умолчанию ru).
# {…} — подстановки.
fallback: "Ой, у меня что-то не получилось. Попробуй ещё раз."
blocked_default: "Сейчас сказки нельзя."
budget_default: "Пора отдыхать."
tags_default: "Сейчас эту сказку включить нельзя."
module_denied: "Это сейчас включить нельзя."
age_denied: "Эта сказка для ребят постарше. Давай выберем другую."
budget_over_context: "Время сказок на сейчас закончилось: новые сказки не включай, ласково предложи отдыхать."
context_speaker: "Говорит: {name}"
context_speaker_age: "Говорит: {name}, {age} лет"
context_tags: "Сейчас можно включать только сказки с тегами: {tags}"
context_modules: "Доступно: {modules}"
context_unknown: "Говорящий не узнан по голосу"

parent:
  ok_mode: "Хорошо. {title}{names} до {time}."
  ok_clear: "Хорошо, обычный режим{names}."
  relax_denied: "Снять режим может только взрослый — с телефона или своим голосом."
  not_understood: "Не поняла команду."
  for_names: " для {names}"

time:
  hours: "{h} часов"
  hours_minutes: "{h} {m:02d}"

onboarding:
  voice_only: "Познакомиться можно только голосом — скажи это колонке."
  too_many: "Я уже знаю очень много людей. Попроси взрослого навести порядок в профилях."
  ask_name: "Давай! Как тебя зовут?"
  ask_name_again: "Скажи ещё раз, как тебя зовут?"
  confirm_name: "{name}, правильно?"
  ask_age: "Приятно познакомиться, {name}! А сколько тебе лет?"
  ask_age_again: "Скажи числом, сколько тебе лет. Или скажи «не скажу»."
  repeat_intro: "Теперь повтори за мной: {phrase}"
  repeat_next: "Отлично! Теперь: {phrase}"
  repeat_again: "Не расслышала. Повтори, пожалуйста: {phrase}"
  repeat_other_voice: "Кажется, это сказал кто-то другой. Пусть {name} повторит: {phrase}"
  known: "Мы уже знакомы — ты {name}? Хочешь, я получше запомню твой голос?"
  known_no: "Хорошо! Если что — скажи «давай познакомимся» ещё раз."
  known_other: "Ай-ай-ай! Я тебя узнала — ты {name}. Второй раз знакомиться под другим именем нельзя. Если я ошиблась — позови родителей."
  closed: "Сейчас я не знакомлюсь с новыми людьми. Попроси родителей разрешить."
  done: "Готово, {name}! Теперь я буду тебя узнавать."
  done_again: "Готово, {name}! Теперь я узнаю тебя ещё лучше."
  failed: "Не получилось хорошо расслышать голос. Давай попробуем в другой раз."
  cancelled: "Хорошо, познакомимся в другой раз."
  phrases:
    - "Колобок катился по дорожке"
    - "В лесу родилась ёлочка"
    - "Мы с мамой пошли гулять в парк"
    - "Жили-были дед и баба"
